<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fffaf2">
<meta name="description" content="Organize encomendas, pagamentos e a semana da sua confeitaria.">
<title>Doce Agenda — pedidos da sua confeitaria</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/nova/nova.css">
<script src="/browser-store.js" defer></script>
<script src="/data-client.js" defer></script>
<script src="/nova/nova.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <h1 class="top-date" id="today-label">Agenda</h1>
    <div class="top-actions">
      <button class="btn btn-outline btn-small" type="button" data-act="link">Meu link</button>
      <button class="icon-btn" type="button" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
  <p class="wrap demo-line" id="demo-line" hidden>Exemplo: a semana da Lu, da Doces da Lu.</p>
</header>

<main class="wrap" id="main">
  <p class="load-state" id="load-state" role="status">Abrindo a agenda…</p>
  <div id="views" hidden>
    <section id="view-agenda" aria-label="Agenda"></section>
    <section id="view-dinheiro" aria-labelledby="month-title" hidden></section>
  </div>
</main>

<nav class="bar" aria-label="Principal">
  <div class="bar-inner">
    <button class="bar-tab" type="button" data-tab="agenda" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Agenda</button>
    <button class="btn btn-primary bar-new" type="button" data-act="new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo pedido</button>
    <button class="bar-tab" type="button" data-tab="dinheiro"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Dinheiro<span class="bar-badge" id="money-badge" hidden></span></button>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-top">
    <button class="link-btn sheet-back" id="sheet-back" type="button" data-act="back" hidden>‹ Voltar</button>
    <button class="icon-btn sheet-close" type="button" data-act="close" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</dialog>

<div class="toast" id="toast" popover="manual" role="status" hidden><span id="toast-text"></span><button class="toast-undo" id="toast-undo" type="button" hidden>Desfazer</button></div>
</body>
</html>
