<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Doce Agenda — imagem de compartilhamento</title>
<style>
/* Fonte da imagem public/landing/assets/og.jpg (1200x630). Gerada por scripts/build-og-image.mjs. */
@font-face{font-family:Fredoka;src:url("../public/fonts/Fredoka.ttf") format("truetype");font-weight:300 700;font-stretch:75% 125%}
@font-face{font-family:Figtree;src:url("../public/fonts/Figtree.ttf") format("truetype");font-weight:300 900}
:root{--ameixa:#2b1a2c;--glace:#f7c5d0;--pistache:#d3e7c1;--baunilha:#fbe9a9;--carimbo:#2e6a46;--papel:#fffaf2;--soft:#4a3550}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--glace);color:var(--ameixa);font-family:Figtree,sans-serif}
.brand{position:absolute;left:84px;top:64px;display:block;width:290px;height:auto}
h1{position:absolute;left:84px;top:178px;width:600px;margin:0;font-family:Fredoka,sans-serif;font-size:66px;font-weight:600;line-height:1.04;letter-spacing:-.02em}
.tag{position:absolute;left:84px;bottom:64px;margin:0;color:var(--soft);font-size:22px;font-weight:600}
.stack{position:absolute;right:72px;top:68px;width:392px;display:flex;flex-direction:column;gap:14px}
.day{padding:20px 24px;border-radius:28px;background:var(--pistache);display:flex;align-items:baseline;gap:14px;font-family:Fredoka,sans-serif}
.day b{font-size:84px;font-weight:600;line-height:.9;letter-spacing:-.03em}
.day span{font-size:24px;font-weight:500;line-height:1.1}
.card{position:relative;display:flex;gap:16px;padding:18px 22px;border-radius:24px;background:#fff}
.card.pending{background:var(--baunilha)}
.time{min-width:58px;font-family:Fredoka,sans-serif;font-size:26px;font-weight:600}
.text{display:flex;flex-direction:column;gap:2px;font-size:17px;color:var(--soft)}
.text b{font-size:21px;color:var(--ameixa)}
.stamp{position:absolute;right:18px;top:50%;margin-top:-22px;padding:5px 11px;border:3px solid var(--carimbo);border-radius:8px;background:rgba(255,255,255,.88);color:var(--carimbo);font-family:Fredoka,sans-serif;font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-8deg)}
.fictional{margin:0;padding-left:8px;color:var(--soft);font-size:15px;font-weight:600}
</style>
</head>
<body>
<img class="brand" src="../public/logo.svg" alt="Doce Agenda">
<h1>O combinado de cada encomenda, em um só lugar.</h1>
<p class="tag">Agenda de encomendas para confeiteiras</p>
<div class="stack">
  <div class="day"><b>3</b><span>encomendas para entregar</span></div>
  <div class="card"><span class="time">15h</span><span class="text"><b>Bolo de aniversário</b>Marina · retirada</span><span class="stamp">Sinal pago</span></div>
  <div class="card pending"><span class="time">17h</span><span class="text"><b>Torta de limão</b>Paulo · falta o sinal</span></div>
  <p class="fictional">Exemplo fictício</p>
</div>
</body>
</html>
