<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Doce Agenda — imagem de compartilhamento</title>
<style>
/* Fonte da imagem public/landing/assets/og.jpg (1200x630). Gerada por scripts/build-og-image.mjs. */
@font-face{font-family:Lora;src:url("../public/fonts/Lora.ttf") format("truetype");font-weight:400 700}
@font-face{font-family:Manrope;src:url("../public/fonts/Manrope.ttf") format("truetype");font-weight:200 800}
:root{--ink:#392923;--muted:#715f55;--terracotta:#a34432;--cream:#f3eadc;--arch:#e6d3bc}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--cream);color:var(--ink);font-family:Manrope,sans-serif}
.brand{position:absolute;left:84px;top:72px;display:block;width:300px;height:auto}
h1{position:absolute;left:84px;top:196px;width:590px;margin:0;font-family:Lora,Georgia,serif;font-size:60px;font-weight:500;line-height:1.14;letter-spacing:-.035em;text-wrap:balance}
h1 em{color:var(--terracotta);font-style:normal;font-weight:400}
.tag{position:absolute;left:84px;bottom:68px;margin:0;color:var(--muted);font-size:20px;font-weight:600;letter-spacing:.01em}
/* Arco: topo arredondado como a foto do herói da landing (MA-3). */
.arch{position:absolute;right:76px;bottom:0;width:480px;height:560px;border-radius:240px 240px 0 0;background:var(--arch);overflow:hidden}
/* Captura real (agenda.webp, 390x844) recortada: cabeçalho da lista e os dois cartões de pedido. */
.shot{position:absolute;left:24px;bottom:56px;width:432px;height:332px;border-radius:14px;overflow:hidden;box-shadow:0 18px 44px rgba(57,41,35,.2);background:#fbf7f0 url("../public/landing/assets/agenda.webp") no-repeat;background-size:444.6px 962.2px;background-position:-5.7px -256.5px}
.fictional{position:absolute;left:0;right:0;top:132px;margin:0;text-align:center;color:var(--muted);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<img class="brand" src="../public/logo.svg" alt="Doce Agenda">
<h1>O combinado de cada encomenda, <em>em um só lugar.</em></h1>
<p class="tag">Agenda de encomendas para confeiteiras</p>
<div class="arch">
  <p class="fictional">Exemplo fictício</p>
  <div class="shot" role="img" aria-label="Cartões de pedido da agenda (exemplo fictício)"></div>
</div>
</body>
</html>
