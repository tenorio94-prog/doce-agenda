<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fornada — imagem de compartilhamento</title>
<style>
/* Fonte da imagem public/landing/assets/og.jpg (1200x630). Gerada por scripts/build-og-image.mjs. */
@font-face{font-family:"Fraunces";src:url("../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2") format("woff2-variations");font-weight:100 900}
@font-face{font-family:"DM Sans";src:url("../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-opsz-normal.woff2") format("woff2-variations");font-weight:100 1000}
:root{--papel-manteiga:#F7F7F4;--farinha:#EEEDE8;--porcelana:#FFFFFF;--ferro:#161D2B;--tinta:#354052;--grafite:#525B6B;--azul-louca:#1D449B;--nevoa:#E6EEFA;--linha:#DCE0E6;--pago:#166534;--pago-soft:#E3F4E8;--sinal:#854D0E;--sinal-soft:#FEF2D4}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--papel-manteiga);color:var(--ferro);font-family:"DM Sans",sans-serif;border-top:6px solid var(--azul-louca)}
.brand{position:absolute;left:84px;top:60px;display:block;width:270px;height:auto}
h1{position:absolute;left:84px;top:164px;width:580px;margin:0;font-family:"Fraunces",Georgia,serif;font-variation-settings:"SOFT" 50;font-size:62px;font-weight:700;line-height:1.04;letter-spacing:-.03em;color:var(--ferro)}
.tag{position:absolute;left:84px;bottom:60px;margin:0;color:var(--grafite);font-size:22px;font-weight:600}
.stack{position:absolute;right:64px;top:64px;width:434px;display:flex;flex-direction:column;gap:14px}
.day{padding:20px 24px;border-radius:26px;background:var(--nevoa);border:1px solid #C9D8F2;display:flex;align-items:baseline;gap:16px}
.day b{font-family:"Fraunces",Georgia,serif;font-variation-settings:"SOFT" 50;font-size:84px;font-weight:700;line-height:.9;letter-spacing:-.03em;color:var(--azul-louca);font-variant-numeric:tabular-nums}
.day span{font-family:"Fraunces",Georgia,serif;font-variation-settings:"SOFT" 50;font-size:24px;font-weight:600;line-height:1.1;color:var(--ferro)}
.card{position:relative;display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:22px;background:var(--porcelana);border:1px solid var(--linha);box-shadow:0 10px 26px -10px rgb(22 29 43 / 10%)}
.card.pending{background:var(--sinal-soft);border-color:#E8D39E;box-shadow:none}
.time{min-width:48px;font-family:"DM Sans",sans-serif;font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;color:var(--azul-louca)}
.card.pending .time{color:var(--sinal)}
.text{display:flex;flex-direction:column;gap:2px;font-size:16px;color:var(--tinta);padding-right:132px}
.text b{font-size:19px;color:var(--ferro);white-space:nowrap}
.card.pending .text{padding-right:0;color:var(--sinal)}
.stamp{position:absolute;right:18px;top:50%;margin-top:-20px;padding:5px 11px;border:2.5px solid var(--pago);border-radius:8px;background:var(--pago-soft);color:var(--pago);font-family:"Fraunces",Georgia,serif;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-6deg)}
.fictional{margin:0;padding-left:8px;color:var(--grafite);font-size:15px;font-weight:600}
</style>
</head>
<body>
<img class="brand" src="../public/logo.svg" alt="Fornada">
<h1>O combinado de cada encomenda, em um só lugar.</h1>
<p class="tag">Agenda de encomendas para confeiteiras</p>
<div class="stack">
  <div class="day"><b>3</b><span>encomendas para entregar</span></div>
  <div class="card"><span class="time">15h</span><span class="text"><b>Bolo de aniversário</b>Marina · retirada</span><span class="stamp">Sinal pago</span></div>
  <div class="card pending"><span class="time">17h</span><span class="text"><b>Torta de limão</b>Paulo · falta o sinal</span></div>
  <p class="fictional">Exemplo fictício</p>
</div>
</body>
</html>
